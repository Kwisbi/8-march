<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой ккотик ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-pink: #ff80ab;
            --dark-pink: #d81b60;
        }

        body {
            font-family: 'Caveat', cursive;
            margin: 0; padding: 20px;
            background: #fff5f7;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимация падающих сердечек */
        .heart {
            position: fixed; top: -1vh;
            color: var(--main-pink);
            font-size: 1.5rem;
            user-select: none; z-index: -1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) translateX(20px) rotate(360deg); opacity: 0; }
        }

        /* Таймер */
        .timer-container {
            background: white; border-radius: 20px; padding: 15px;
            box-shadow: 0 5px 15px rgba(255,128,171,0.2);
            text-align: center; margin-bottom: 20px; width: 100%; max-width: 350px;
        }
        .timer-title { font-size: 1.2rem; color: var(--dark-pink); margin-bottom: 5px; }
        #timer { font-size: 1.8rem; font-weight: bold; color: #555; }

        .header { display: flex; align-items: center; margin-bottom: 20px; z-index: 1; }
        .profile-pic-container { 
            width: 70px; height: 70px; border-radius: 50%; overflow: hidden; 
            border: 3px solid var(--main-pink); box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .profile-pic { width: 100%; height: 100%; object-fit: cover; }
        .header-text { margin-left: 15px; font-family: 'Pacifico', cursive; font-size: 1.8em; color: var(--dark-pink); }

        .main-stage {
            width: 100%; max-width: 400px;
            background: #fff; border-radius: 20px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); margin-bottom: 25px;
            min-height: 250px; display: flex; justify-content: center; align-items: center;
            border: 5px solid white;
        }

        video, .photo-display { width: 100%; display: none; }
        .active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .placeholder-text { padding: 30px; text-align: center; font-size: 1.6em; color: var(--main-pink); }

        .buttons-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
            width: 100%; max-width: 400px; z-index: 1;
        }

        .btn-item {
            background: rgba(255, 255, 255, 0.9); border: 1px solid #ffcdd2; border-radius: 18px;
            padding: 12px; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .btn-item:hover { background: white; transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .btn-icon { font-size: 1.8em; }
        .btn-title { font-size: 1em; font-weight: bold; color: var(--dark-pink); margin-top: 5px; }

        .full-width { grid-column: 1 / 3; background: linear-gradient(to right, #fff, #fff0f5); }

        .modal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 40px 20px; border-radius: 25px; width: 85%;
            text-align: center; font-size: 1.8em; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="timer-container">
        <div class="timer-title">Мы вместе:</div>
        <div id="timer">Загрузка...</div>
    </div>

    <div class="header">
        <div class="profile-pic-container">
            <img src="cat
.jpg" alt="Фото" class="profile-pic">
        </div>
        <div class="header-text">Твой котик ❤️</div>
    </div>

    <div class="main-stage" id="stage">
        <div id="placeholder" class="placeholder-text">Нажми на любой подарок ниже... ✨</div>
        <video id="mainVid" controls playsinline></video>
        <img id="mainImg" class="photo-display" src="" alt="Наше фото">
    </div>

    <div class="buttons-grid">
        <div class="btn-item" onclick="showPhoto('1.jpg')"><span class="btn-icon">🎥</span><span class="btn-title">С чего всё началось</span></div>
        <div class="btn-item" onclick="showVideo('v2.mp4')"><span class="btn-icon">🎬</span><span class="btn-title">Наши моменты</span></div>
        <div class="btn-item" onclick="showVideo('3.mp4')"><span class="btn-icon">🍿</span><span class="btn-title">Твой котик</span></div>
        <div class="btn-item" onclick="showPhoto('2.jpg')"><span class="btn-icon">📸</span><span class="btn-title">Любимый кадр</span></div>
        <div class="btn-item" onclick="showText('Ты делаешь мою жизнь ярче каждый день. Спасибо, что ты есть!')"><span class="btn-icon">💌</span><span class="btn-title">Записка</span></div>
        <div class="btn-item" onclick="showText('Я обещаю всегда беречь твою улыбку.')"><span class="btn-icon">🎗️</span><span class="btn-title">Обещание</span></div>
        <div class="btn-item full-width" onclick="showText('Я тебя очень сильно люблю! Если будет сложно, загляни под рамку')"><span class="btn-icon">✨</span><span class="btn-title">Нажми сюда</span></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="position:absolute; right:20px; top:10px; cursor:pointer; font-size:1.2em;">✕</span>
            <p id="modalMsg"></p>
        </div>
    </div>

    <script>
        // --- ЛОГИКА ТАЙМЕРА ---
        // Укажи дату начала ваших отношений (Год, Месяц(0-11), День)
        const startDate = new Date(2025, 6, 1); // Например, 1 июля 2025

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / (1000 * 60)) % 60);
            document.getElementById('timer').innerText = `${days}д ${hours}ч ${mins}м`;
        }
        setInterval(updateTimer, 60000);
        updateTimer();

        // --- ЛОГИКА СЕРДЕЧЕК ---
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 500 + Math.random() * 1000);

        // --- ЛОГИКА КОНТЕНТА ---
        const vid = document.getElementById('mainVid');
        const img = document.getElementById('mainImg');
        const holder = document.getElementById('placeholder');
        const modal = document.getElementById('modal');
        const msg = document.getElementById('modalMsg');

        function resetStage() {
            vid.classList.remove('active'); vid.pause();
            img.classList.remove('active');
            holder.style.display = 'none';
        }
        function showVideo(src) { resetStage(); vid.src = src; vid.classList.add('active'); vid.load(); }
        function showPhoto(src) { resetStage(); img.src = src; img.classList.add('active'); }
        function showText(text) { msg.innerText = text; modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }
    </script>
</body>

</html>
